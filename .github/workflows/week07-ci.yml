# Root-level trigger for the week07-cicd lab. GitHub Actions only discovers
# workflow files under the repository's top-level .github/workflows/, so this
# mirrors week07-cicd/.github/workflows/ci.yml (kept there for the lab's own
# self-check, tests/test_ci_config.py) with a working-directory pointed at the
# lab subfolder and a path filter so it only runs on changes to that lab.
name: week07-cicd CI

on:
  push:
    branches: [main]
    paths: ["week07-cicd/**"]
  pull_request:
    branches: [main]
    paths: ["week07-cicd/**"]

defaults:
  run:
    working-directory: week07-cicd

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: flake8 src/

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -q

  integration-test:
    runs-on: ubuntu-latest
    needs: ["lint", "unit-test"]
    steps:
      - uses: actions/checkout@v4
      - name: Run integration test
        run: |
          chmod +x scripts/integration_test.sh
          ./scripts/integration_test.sh
